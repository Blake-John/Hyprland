colors:
  primary:
    background: '{{ background }}'
    foreground: '{{ onBackground }}'

  cursor:
    text: '{{ onPrimary }}'
    cursor: '{{ primary }}'

  search:
    matches:
      foreground: '{{ background }}'
      background: '{{ tertiary }}'
    focused_match:
      foreground: '{{ background }}'
      background: '{{ primary }}'

  selection:
    text: '{{ onPrimaryContainer }}'
    background: '{{ primaryContainer }}'

  normal:
    black:   '{{ term0 }}'
    red:     '{{ term1 }}'
    green:   '{{ term2 }}'
    yellow:  '{{ term3 }}'
    blue:    '{{ term4 }}'
    magenta: '{{ term5 }}'
    cyan:    '{{ term6 }}'
    white:   '{{ term7 }}'

  bright:
    black:   '{{ term8 }}'
    red:     '{{ term9 }}'
    green:   '{{ term10 }}'
    yellow:  '{{ term11 }}'
    blue:    '{{ term12 }}'
    magenta: '{{ term13 }}'
    cyan:    '{{ term14 }}'
    white:   '{{ term15 }}'
