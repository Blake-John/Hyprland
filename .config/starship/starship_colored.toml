palette = "ii"

# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = '''
$cmd_duration 󰜥 $directory $git_branch$git_commit$git_status$git_state$python$conda$rust$c
$character
'''

right_format = "$username$hostname $time"
continuation_prompt = "[∙](bright-black) "
scan_timeout = 30
command_timeout = 1000
follow_symlinks = true

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[   ](bold fg:blue)"
error_symbol = "[   ](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
# [package]
# disabled = true

[python]
version_format = "v${raw}"
symbol = "🐍 "
style = "yellow bold"
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\)) ]($style)'

[conda]
format = '[$symbol$environment ](green)'

[rust]
symbol = '🦀 '
format = '[$symbol($version) ]($style)'

[c]
format = "[$symbol($version(-$name) )]($style)"
version_format = "v${raw}"
style = "149 bold"
symbol = " "
disabled = false
detect_extensions = [
    "c",
    "h",
	"cpp",
	"hpp"
]
detect_files = []
detect_folders = []
commands = [
    [
    "cc",
    "--version",
],
    [
    "gcc",
    "--version",
],
    [
    "clang",
    "--version",
],
]

[git_branch]
style = "bg: cyan"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "󰜥 [](bold fg:cyan)[$symbol $branch(:$remote_branch)](fg:black bg:cyan)[ ](bold fg:cyan)"
# format = "[](bold fg:cyan)[$symbol $branch(:$remote_branch)](fg:black bg:cyan)[ ](bold fg:cyan)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

# [git_status]
# conflicted = " 🏳 "
# ahead = " 🏎💨 "
# behind = " 😰 "
# diverged = " 😵 "
# untracked = " 🤷 ‍"
# stashed = " 📦 "
# modified = " 📝 "
# staged = '[++\($count\)](green)'
# renamed = " ✍️ "
# deleted = " 🗑 "
#
[git_status]
format = '([\[ $all_status$ahead_behind\]]($style) )'
style = "red bold"
stashed = '\$ '
ahead = "⇡"
behind = "⇣"
up_to_date = ""
diverged = "⇕"
conflicted = "!!"
deleted = " "
renamed = "»"
modified = " "
staged = " "
untracked = "?"
typechanged = ""
ignore_submodules = false
disabled = false

[hostname]
ssh_only = false
format =  "[•$hostname](bg:cyan bold fg:black)[](bold fg:cyan)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = false
# format = '🕙[\[ $time \]]($style) '
format = '[\[$time\]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:cyan fg:black"
style_root = "red bold"
format = "[](bold fg:cyan)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:green fg:black"
truncation_length = 6
truncation_symbol = " ••/"
format = '[](bold fg:green)[󰉋 $path]($style)[](bold fg:green)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:yellow)[󰪢 $duration](bold bg:yellow fg:black)[](bold fg:yellow)'

