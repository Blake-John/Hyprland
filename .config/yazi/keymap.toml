[[mgr.prepend_keymap]]
on = [ "y", "y" ]
run = [
    'shell -- for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list',
    "yank",
]
desc = "Yank Target to System Clipboard and Yazi"

[[mgr.prepend_keymap]]
on = [ "y", "p" ]
run = [
    "copy path",
]
desc = "Copy File Path"

[[mgr.prepend_keymap]]
on = [ "y", "d" ]
run = [
    "copy dirname",
]
desc = "Copy File Directory Path"

[[mgr.prepend_keymap]]
on = [ "y", "n" ]
run = [
    "copy filename",
]
desc = "Copy File Name"

[[mgr.prepend_keymap]]
on = [ "y", "N" ]
run = [
    "copy name_without_ext",
]
desc = "Copy File Name Without Extension"

[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
desc = "Manage Devices Mount"

[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"

[[mgr.prepend_keymap]]
on = "<C-n>"
run = '''
    shell 'ripdrag "$@" -x 2>/dev/null &' --confirm
'''
desc = "RipDrag for File Select"

[[mgr.prepend_keymap]]
on = "<C-v>"
run = '''
    shell '~/.config/hypr/scripts/paste_file_to_yazi.sh $(pwd)'
'''
desc = "Paste File to Yazi From System Clipboard"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# If you also using Yazi on Windows:
[[mgr.prepend_keymap]]
on   = "!"
for  = "windows"
run  = 'shell "powershell.exe" --block'
desc = "Open PowerShell here"

[[mgr.prepend_keymap]]
on  = "K"
run = "plugin parent-arrow -1"
desc = "Jump Parent Dir Up"

[[mgr.prepend_keymap]]
on  = "J"
run = "plugin parent-arrow 1"
desc = "Jump Parent Dir Down"

[[mgr.prepend_keymap]]
on   = "<C-g>"
run  = "shell 'lazygit' --block"
desc = "Open Lazygit"

[[mgr.prepend_keymap]]
on   = [ "t", "t" ]
run  = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"

[[mgr.prepend_keymap]]
on   = "2"
run  = "plugin smart-switch 1"
desc = "Switch or create tab 2"

[[mgr.prepend_keymap]]
on   = "3"
run  = "plugin smart-switch 2"
desc = "Switch or create tab 3"

[[mgr.prepend_keymap]]
on   = "4"
run  = "plugin smart-switch 3"
desc = "Switch or create tab 4"

[[mgr.prepend_keymap]]
on   = "5"
run  = "plugin smart-switch 4"
desc = "Switch or create tab 5"

[[mgr.prepend_keymap]]
on = [ "m" ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "`" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = ["A", "C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = ["A", "D"]
# run = 'shell "ouch d $@" --block'
run = 'shell -- for path in "$@"; do ouch d "$path"; done'
desc = "Decompress with ouch"

[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"


