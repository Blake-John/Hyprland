[mgr]
show_hidden = true
linemode = "filesize_dircount"
show_symlink = true

[[plugin.prepend_fetchers]]
id = "git"
name = "*"
run = "git"

[opener]
play = [
    { run = "mpv %s", orphan = true, for = "unix" },
    { run = "mpv %s", orphan = true, for = "windows" },
]

editor = [
    { run = "$EDITOR %s", block = true, for = "unix" },
    { run = "%EDITOR% %s", block = true, for = "windows" },
]

[open]
prepend_rules = [
    # media
    { mime = "video/*", use = "play" },
    { url = "*.mp4", use = "play" },

    # text
    { mime = "text/*", use = "edit" },

    # html
    { url = "*.html", use = [ "open", "edit" ] },
]
