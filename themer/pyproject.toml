[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "themer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
themer = "themer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/themer"]
